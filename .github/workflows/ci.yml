# Unit tests, shellcheck and an end-to-end run of a real server on the runner.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet (linux, darwin, windows)
        run: for os in linux darwin windows; do GOOS=$os go vet ./...; done
      - run: go test ./...

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          shellcheck --version
          shellcheck -s sh internal/scripts/*/*.sh install.sh scripts/build.sh test/integration.sh \
            deploy/entrypoint.sh deploy/rcc-enroll deploy/rcc-gateway-cmd deploy/rcc-gateway-sync deploy/rcc-self-invite

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: docker/setup-buildx-action@v3
      - name: server image
        uses: docker/build-push-action@v6
        with:
          context: deploy
          load: true
          tags: rcc-test:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: binaries
        run: ./scripts/build.sh
      - name: end-to-end
        run: RCC=dist/rcc-linux-amd64 IMAGE=rcc-test:ci sh test/integration.sh
      - name: diagnostics
        if: failure()
        run: |
          sudo docker ps -a
          for c in $(sudo docker ps -aq); do echo "--- $c"; sudo docker logs --tail 50 "$c"; done
          cat ~/.ssh/remote-cc/config 2>/dev/null || true
