# Builds the remote-cc server image (amd64 + arm64) and pushes it to GHCR.
name: server image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      claude_version:
        description: "Claude Code version to bake in (stable, latest, or e.g. 2.1.330)"
        default: stable

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/remote-cc-server
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: deploy
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: CLAUDE_VERSION=${{ inputs.claude_version || 'stable' }}
