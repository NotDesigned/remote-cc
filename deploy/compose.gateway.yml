# remote-cc multi-user gateway: the only public port of the server.
services:
  gateway:
    image: ${RCC_IMAGE:-ghcr.io/notdesigned/remote-cc-server:latest}
    container_name: ${RCC_GATEWAY:-remote-cc-gateway}
    hostname: ${RCC_GATEWAY:-remote-cc-gateway}
    restart: unless-stopped
    init: true
    environment:
      RCC_ROLE: gateway
    ports:
      - "${RCC_PUBLISH:-2222:22}"
    volumes:
      - ${RCC_DATA:-/var/lib/remote-cc}/gateway/ssh:/etc/ssh/keys
      - ${RCC_DATA:-/var/lib/remote-cc}/gateway/etc:/etc/remote-cc/gateway
      - ${RCC_DATA:-/var/lib/remote-cc}/keys:/etc/remote-cc/keys:ro
      # Writable: gateway halves of invites only. Users' keys stay read-only
      # here, so even a compromised gateway cannot authorize keys in a
      # user's container.
      - ${RCC_DATA:-/var/lib/remote-cc}/invites:/etc/remote-cc/invites
    networks:
      - remote-cc
networks:
  remote-cc:
    name: ${RCC_NETWORK:-remote-cc}
    external: true
