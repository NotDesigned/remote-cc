# One user's container in multi-user mode: no published port, reachable only
# through the gateway on the "remote-cc" network.
services:
  remote-cc:
    image: ${RCC_IMAGE:-ghcr.io/notdesigned/remote-cc-server:latest}
    container_name: ${RCC_NAME}
    hostname: ${RCC_NAME}
    restart: unless-stopped
    init: true
    # sshfs (the project dir), unshare/nsenter (private mount namespaces)
    # and setns (--rcb sessions' network) need FUSE, SYS_ADMIN and mount,
    # which Docker's default AppArmor profile denies. This weakens the
    # container boundary: see docs/architecture.md (security model).
    devices:
      - /dev/fuse
    cap_add:
      - SYS_ADMIN
    # Not needed: raw packets (spoofing other containers on the shared
    # network) and device nodes (in dirs the host also reads).
    cap_drop:
      - NET_RAW
      - MKNOD
    security_opt:
      - apparmor:unconfined
    volumes:
      - ${RCC_DATA}/root:/root
      - ${RCC_DATA}/ssh:/etc/ssh/keys
      # Writable: invites enroll new keys from inside (rcc-enroll). A user can
      # only change their own key file, and key options there can only
      # narrow the gateway's rules.
      - ${RCC_KEYS}:/etc/remote-cc/userkeys
      # This user's socket to the egress host (server egress). The scripts
      # always set RCC_EGRESS_DIR; the fallback is an empty dir of this user's
      # own, so a stale .env can never share one socket dir between users.
      - ${RCC_EGRESS_DIR:-${RCC_DATA}/egress-none}:/run/rcc-egress
    networks:
      - remote-cc
networks:
  remote-cc:
    name: ${RCC_NETWORK:-remote-cc}
    external: true
